# Stage E, the 4B build (research/next/STAGE_A.md), only if Stage B passed: the better
# pilot arm continued for a full epoch as a second stage (as v19 -> v20), two seeds from the
# one checkpoint (this file and -seed1), then `strands-decider soup` if the interpolation
# curve between them shows no barrier. checkpoints/next-b-pilot-4b is the winning pilot
# arm (link or copy it there). This file is the control recipe, every Stage D arm off;
# switch on each arm Stage D adopted with exactly the keys its Stage D cell sets (the
# cell-XYZ.yaml whose switches match), in both seed files. A1 makes the epoch longer:
# set max_steps to the new row count / 32. Calibrate afterwards on a 50/50 mix of in-family
# and unseen-v2 dev rows (evaluation/unseen_v2/calibrate_mixed.py).

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3.5-4B-Base"   # recorded only: continue_from loads the checkpoint's own base
continue_from: "checkpoints/next-b-pilot-4b"   # the winning Stage B arm; adapter and head trainable
num_slots: 24
head_type: "pointer"
pointer_dim: 256
head_init: "random"     # unused: continue_from keeps the pilot's head
kl_frozen_weight: 0.3
kl_frozen_skip_kinds: ["noul"]
# A3 off: v20's teacher file, the 27B where it agrees with gold over v14's replay
teacher_file: "data/teacher_yn_qwen35-27b.jsonl"
teacher_weight: 1.0
# A2 off: v20's smoothed score target
ordinal_smoothing: 0.1
head_dropout: 0.05
max_length: 4096

use_lora: true
lora_r: 16
lora_alpha: 32
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
               "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj"]
freeze_torso: false

epochs: 1
max_steps: 3738         # one full epoch of the v20 mixture: 119,623 rows / 32
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001
head_lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true
precompute_frozen_kl: true   # speed only

shuffle_options: true
group_by_length: true
reverse_score_prob: 0.5

output_dir: "checkpoints/next-e-4b-s0"
seed: 0
init_seed: 0
log_every: 20
eval_every: 500

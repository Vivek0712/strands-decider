# Stage D cell 010 (A1 A2 A3 = 0 1 0; arms on: A2).
# The 2^3 factorial screen of research/next/STAGE_A.md: eight cells that continue the
# hobson-v20 soup for 1,500 steps with one seed and one init_seed, so they see the same
# data order and differ only in their arm switches (tests/test_next_configs.py holds that):
#   A1  new training task families: data/families_a1.jsonl appended to train_files
#       (python -m strands_decider.data.families), so every teacher index still holds
#   A2  score_rps_weight 1.0 with ordinal_smoothing 0.0, against v20's smoothing 0.1
#   A3  the fixed two-teacher loss: pool_teacher_files + pool_alpha, against v20's
#       agreement-filtered 27B teacher file
# Read with evaluation/unseen_v2/factorial.py; the decision rule is fixed in STAGE_A.md.

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3.5-2B-Base"
continue_from: "checkpoints/strands-decider-2B-hobson-v20"   # the v20 soup; adapter and head trainable
num_slots: 24
head_type: "pointer"
pointer_dim: 256
head_init: "random"     # unused: continue_from keeps the soup's head
kl_frozen_weight: 0.3
kl_frozen_skip_kinds: ["noul"]
# A3 off: v20's teacher file, the 27B where it agrees with gold over v14's replay
teacher_file: "data/teacher_yn_qwen35-27b.jsonl"
teacher_weight: 1.0
# A2 on: RPS + NLL for the score rows, no ordinal smoothing (an improper target)
score_rps_weight: 1.0
ordinal_smoothing: 0.0
head_dropout: 0.05
max_length: 4096

use_lora: true
lora_r: 16
lora_alpha: 32
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
               "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj"]
freeze_torso: false

epochs: 1
max_steps: 1500
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001
head_lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true
precompute_frozen_kl: true   # speed only

shuffle_options: true
group_by_length: true
reverse_score_prob: 0.5

output_dir: "checkpoints/next-d-010"
seed: 0
init_seed: 0
log_every: 20
eval_every: 500

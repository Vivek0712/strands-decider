# gemma4-e2b-images: a Gemma 4 E2B text Strands Decider continued for one epoch on the image
# rows of configs/vision/v19-images.yaml (variant A: image-removed copies, a 400,000-pixel
# budget per image), with python -m strands_decider.vision_train; training/recipe_images.sh.
# Identical to v19-images.yaml except the checkpoint it starts from, est_image_tokens and the
# output directory (tests/test_configs.py holds that). Three seeds: this file, -seed1, -seed2.
#
# init_from is the TEXT Gemma checkpoint to continue, a local directory: by default the
# bake-off's (configs/experiments/bakeoff/gemma4-e2b.yaml, output_dir). Give another at run
# time: `python -m strands_decider.vision_train THIS.yaml init_from=/path/to/ckpt`, or
# INIT_FROM=/path/to/ckpt with training/recipe_images.sh. Its base_model must be
# google/gemma-4-E2B; the vision tower and its projection come from that base (pinned by the
# checkpoint's base_model_revision), frozen; the audio tower is never loaded.
#
# Images: Gemma's processor (pinned to Gemma4ImageProcessorPil, as served) resizes every
# image to its own budget of at most 280 soft tokens (3 x 3 pooled 16 px patches, about
# 645,000 pixels), so each image takes 256-280 tokens whatever its size; the 400,000-pixel
# budget is applied first, exactly as the server applies `image_max_pixels`.

init_from: "checkpoints/bakeoff-gemma4-e2b"
init_revision: null

data_root: "data/image/build"
train_files: ["vqa.jsonl", "count.jsonl", "m2w.jsonl", "charts.jsonl", "docs.jsonl", "tabfact.jsonl"]
dedupe_drop: "data/image/build/dedupe_drop.txt"   # empty for the recorded build
# v19's own committed training rows (the bake-off trained on the same files), to protect text behaviour
text_replay_files: ["data/synthetic/generated_v16.jsonl", "data/synthetic/generated_v18.jsonl",
                    "data/synthetic/adequacy_gen.jsonl"]
text_replay_n: 3000
# An image-removed copy of 15% of the image rows with <= 9 options: no label, trained only
# toward the frozen torso's reading of the text-only prompt (kl_only_weight)
ablation_fraction: 0.15
kl_frozen_weight: 0.3   # KL(frozen || student) on the labelled rows, image in the prompt
kl_only_weight: 1.0
val_fraction: 0.03

image_long_side: 0      # no long-side cap: the pixel budget alone
image_max_pixels: 400000
est_image_tokens: 280   # Gemma's processor: at most 280 soft tokens per image
max_length: 4096
shuffle_options: true
ordinal_smoothing: 0.1

epochs: 1
lr: 0.00005             # LoRA
head_lr: 0.0002         # a trained head: a smaller step than the bake-off's fresh one
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
micro_rows: 16
micro_tokens: 12000
rows_per_step: 32
gradient_checkpointing: true
workers: 8

output_dir: "checkpoints/gemma4-e2b-images"
seed: 0
log_every: 20
eval_every: 400
val_batches: 60

# strands-decider-4B-hobson-v22, stage 3 (images): the calibrated text soup continued for one
# epoch on the image recipe of strands-decider-2B-hobson-v20-vl.yaml, unchanged: ~38K image
# questions at the 400,000-pixel budget, image-removed copies of 15% of them, no frozen-KL
# anchor on yes/no rows, and replayed text rows trained toward their 27B-teacher targets.
# Two seeds were run; the published strands-decider-4B-hobson-v22 is this seed (0), chosen
# by a rule fixed before the run (highest public score among seeds whose images are not
# worse than hobson-v20-balanced's). Its text temperatures are the text soup's; image
# temperatures were fitted but are not applied. Every command:
# docs/models/strands-decider-4B-hobson-v22.md. The values are the recorded run's.

init_from: "checkpoints/strands-decider-4B-hobson-v22-text"   # the text soup, calibrated
init_revision: null

data_root: "data/image/build"
train_files: ["vqa.jsonl", "count.jsonl", "m2w.jsonl", "charts.jsonl", "docs.jsonl", "tabfact.jsonl"]
dedupe_drop: "data/image/build/dedupe_drop.txt"   # empty for the recorded build
# 3,000 of the v20 recipe's text training rows (2,000 yes/no), each with its 27B-teacher target, so
# the replay keeps the text stage's decisive yes/no answers (python -m strands_decider.data.teacher_yn replay)
text_replay_files: ["data/replay_teacher_yn.jsonl"]
text_replay_n: 3000
teacher_weight: 1.0
# An image-removed copy of 15% of the image rows with <= 9 options: no label, trained only
# toward the frozen torso's reading of the text-only prompt (kl_only_weight)
ablation_fraction: 0.15
kl_frozen_weight: 0.3   # KL(frozen || student) on the labelled rows, image in the prompt...
kl_frozen_skip_kinds: ["noul"]   # ...except yes/no rows, as in v20's text training
kl_only_weight: 1.0
val_fraction: 0.03

image_long_side: 0      # no long-side cap: the pixel budget alone
image_max_pixels: 400000
est_image_tokens: 400
max_length: 4096
shuffle_options: true
ordinal_smoothing: 0.1

epochs: 1
lr: 0.00005             # LoRA
head_lr: 0.0002         # a trained head: a smaller step than v19's fresh one
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
micro_rows: 16
micro_tokens: 12000
rows_per_step: 32
gradient_checkpointing: true
workers: 8

output_dir: "checkpoints/strands-decider-4B-hobson-v22-vl-s0"
seed: 0
log_every: 20
eval_every: 400
val_batches: 60

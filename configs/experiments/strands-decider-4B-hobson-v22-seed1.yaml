# strands-decider-4B-hobson-v22-seed1: strands-decider-4B-hobson-v22.yaml exactly, with seed 1
# -- the second seed of the soup.

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl",
              "data/families_a1.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3.5-4B-Base"   # as recorded; unused: continue_from loads the pilot's own base (Qwen3.5-4B)
continue_from: "checkpoints/strands-decider-4B-hobson-v22-pilot"   # adapter and head trainable, calibration reset
num_slots: 24
head_type: "pointer"
pointer_dim: 256
head_init: "random"     # unused: continue_from keeps the pilot's head
kl_frozen_weight: 0.3
kl_frozen_skip_kinds: ["noul"]
# v20's teacher file: the 27B where it agrees with gold, over v14's replay
teacher_file: "data/teacher_yn_qwen35-27b.jsonl"
teacher_weight: 1.0
# v20's smoothed score target
ordinal_smoothing: 0.1
head_dropout: 0.05
max_length: 4096

use_lora: true
lora_r: 16
lora_alpha: 32
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
               "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj"]
freeze_torso: false

epochs: 1
max_steps: 0            # one full epoch of the v20 mixture + A1: 4,465 steps
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001
head_lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true
precompute_frozen_kl: true   # speed only

shuffle_options: true
group_by_length: true
reverse_score_prob: 0.5

output_dir: "checkpoints/strands-decider-4B-hobson-v22-text-s1"
seed: 1
init_seed: 0            # both seeds start from one point, so they can be averaged
log_every: 20
eval_every: 500

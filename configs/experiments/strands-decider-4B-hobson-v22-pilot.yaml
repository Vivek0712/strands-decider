# strands-decider-4B-hobson-v22, stage 1 (the pilot): the base bake-off's from-raw recipe
# (bakeoff/qwen35-2b.yaml: v19-yn27b's data and losses) for 1,500 steps on Qwen3.5-4B, the
# post-trained model, pinned. Gate, fixed before the run: go on to 4B only if it scores >= +5
# public v1.5-style Intelligence over the same 1,500 steps at 2B and is not worse on
# unseen-v2 dev (it scored 50.4 against 34.2, and +14.2 on unseen-v2 dev). Every command:
# docs/models/strands-decider-4B-hobson-v22.md. The values are the recorded run's.

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3.5-4B"   # post-trained (Apache-2.0); not the -Base model
base_revision: "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
num_slots: 24           # must match `data build --max-options`; also the KL reference width
head_type: "pointer"    # scores each option from its own hidden state; see modeling.PointerHead
pointer_dim: 256
head_init: "random"
kl_frozen_weight: 0.3   # KL(frozen || student) over the option-number readout...
kl_frozen_skip_kinds: ["noul"]   # ...except on yes/no rows
# The 27B's distributions where they agree with gold, over v14's own on the multi-step rows
# (`training/recipe.sh teacher_yn`)
teacher_file: "data/teacher_yn_qwen35-27b.jsonl"
teacher_weight: 1.0
head_dropout: 0.05
max_length: 4096

use_lora: true
lora_r: 16
lora_alpha: 32
# Attention and MLP projections, plus the recurrent layers' own (as v19).
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
               "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj"]
freeze_torso: false

epochs: 1
max_steps: 1500         # the pilot's fixed budget
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001              # LoRA
head_lr: 0.001          # randomly-initialised head needs a bigger step
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true
precompute_frozen_kl: true   # speed only

shuffle_options: true
group_by_length: true
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/strands-decider-4B-hobson-v22-pilot"
seed: 0
log_every: 20
eval_every: 500
